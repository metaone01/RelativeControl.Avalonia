name: API Unittest

on:
  push:
    branches:
      - v11(LTS)
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore ./Test.RelativeControl/Test.RelativeControl.csproj

      - name: Restore dependencies
        run: dotnet restore ./Test.RelativeControl/Test.RelativeControl.csproj

      - name: Build
        run: dotnet build --no-restore --configuration Release ./Test.RelativeControl/Test.RelativeControl.csproj

      - name: Run tests
        run: dotnet run --project ./Test.RelativeControl/Test.RelativeControl.csproj